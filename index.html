<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دروسك بلس | الردود الآلية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fb;color:#172033;font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#315bea,#7448d8);color:white;padding:24px 18px}
main{max-width:850px;margin:22px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #18264b0d}
h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,textarea{width:100%;border:1px solid #d9deea;border-radius:10px;padding:12px;font:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:bold;cursor:pointer;background:#315bea;color:white}
button.secondary{background:#e9edff;color:#2448c5}button.danger{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.reply{border:1px solid #e1e5ef;border-radius:12px;padding:14px;margin:12px 0}
.replyhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#667085;font-size:13px}
.status{margin-top:12px;font-weight:bold}.empty{color:#667085;text-align:center;padding:20px}
</style>
</head>
<body>
<header><h1>دروسك بلس — الردود الآلية</h1><div>أضف كلمة أو عبارة، وحدد الرد الذي يرسله البوت تلقائيًا.</div></header>
<main>
<section class="card">
<h2>إضافة رد جديد</h2>
<label for="keyword">الكلمة أو العبارة</label><input id="keyword" placeholder="مثال: اشتراك">
<label for="reply">الرد التلقائي</label><textarea id="reply" placeholder="اكتب الرد الذي سيصل للطالب"></textarea>
<div class="actions"><button id="add">إضافة الرد</button><button class="secondary" id="clear">مسح الحقول</button></div>
<div id="status" class="status" role="status"></div>
</section>
<section class="card">
<h2>الردود المحفوظة</h2><div class="muted">إذا كتب الطالب الكلمة داخل رسالته، يرسل البوت الرد المطابق. عند تطابق أكثر من كلمة، تُستخدم العبارة الأطول.</div>
<div id="list"><div class="empty">جاري التحميل...</div></div>
</section>
<section class="card">
<h2>رد افتراضي (اختياري)</h2>
<label for="defaultReply">يُرسل إذا لم تطابق الرسالة أي كلمة</label>
<textarea id="defaultReply" placeholder="اتركه فارغًا لتعطيل الرد الافتراضي"></textarea>
<div class="actions"><button id="saveDefault">حفظ الرد الافتراضي</button></div>
</section>
</main>
<script>
let data={replies:[],defaultReply:""};
const $=id=>document.getElementById(id);
function status(msg,ok=true){$("status").textContent=msg;$("status").style.color=ok?"#16803c":"#b42318";}
async function load(){
 const r=await fetch("/api/replies"); if(!r.ok) throw new Error("تعذر تحميل الردود");
 data=await r.json(); $("defaultReply").value=data.defaultReply||""; render();
}
function render(){
 const list=$("list"); list.innerHTML="";
 if(!data.replies.length){list.innerHTML='<div class="empty">لسه مفيش ردود محفوظة.</div>';return;}
 data.replies.forEach((item,index)=>{
  const div=document.createElement("div");div.className="reply";
  const head=document.createElement("div");head.className="replyhead";
  const strong=document.createElement("strong");strong.textContent=item.keyword;
  const state=document.createElement("span");state.className="muted";state.textContent=item.enabled===false?"متوقف":"مفعّل";
  head.append(strong,state);div.append(head);
  const ta=document.createElement("textarea");ta.value=item.reply;ta.style.marginTop="10px";div.append(ta);
  const actions=document.createElement("div");actions.className="actions";
  const save=document.createElement("button");save.textContent="حفظ التعديل";save.onclick=async()=>{data.replies[index].reply=ta.value;await persist();};
  const toggle=document.createElement("button");toggle.className="secondary";toggle.textContent=item.enabled===false?"تفعيل":"إيقاف";toggle.onclick=async()=>{data.replies[index].enabled=item.enabled===false;await persist();};
  const del=document.createElement("button");del.className="danger";del.textContent="حذف";del.onclick=async()=>{if(confirm("تحذف الرد ده؟")){data.replies.splice(index,1);await persist();}};
  actions.append(save,toggle,del);div.append(actions);list.append(div);
 });
}
async function persist(){
 const r=await fetch("/api/replies",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
 if(!r.ok){status("حصل خطأ أثناء الحفظ",false);return;}
 status("تم الحفظ بنجاح");await load();
}
$("add").onclick=async()=>{
 const keyword=$("keyword").value.trim(),reply=$("reply").value.trim();
 if(!keyword||!reply){status("اكتب الكلمة والرد الأول",false);return;}
 data.replies.push({id:Date.now().toString(),keyword,reply,enabled:true});
 $("keyword").value="";$("reply").value="";await persist();
};
$("clear").onclick=()=>{$("keyword").value="";$("reply").value="";status("");};
$("saveDefault").onclick=async()=>{data.defaultReply=$("defaultReply").value;await persist();};
load().catch(e=>status(e.message,false));
</script>
</body>
</html>
